<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d7ea3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tillykke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FARVER
   ============================================================ */
:root{
  --deep:#04263c;
  --deep2:#075a7e;
  --sea:#0d7ea3;
  --sea-light:#3fc6dd;
  --foam:#bdeef7;
  --sand:#efdcb2;
  --paper:#fdf7ea;
  --paper2:#f6ebd6;
  --ink:#22384a;
  --ink-soft:#4c6377;
  --gold:#c8973f;
  --gold-light:#e8c66a;
  --coral:#e2705a;
  --wax:#b5382c;
  --wax-dark:#8d2419;
  --shadow:rgba(2,26,44,.45);

  /* det mørke kort — kortets inderside, quiz-arket og gavekortet */
  --card1:#0b2c44;
  --card2:#07223b;
  --card3:#05192c;
  --card-ink:#f0e2cd;      /* brødtekst på mørk bund */
  --card-soft:#9db3c4;     /* småt, dæmpet */
  --creme:#fdf7ea;         /* overskrifter */
  --coral-l:#f3947c;       /* navne og signatur */
  --gold-soft:rgba(232,198,106,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Lora',Georgia,'Times New Roman',serif;
  color:var(--ink);
  background:linear-gradient(180deg,
    #52d6e8 0%, #2bb6d4 12%, #128fb2 30%,
    #0a6b91 50%, #075172 68%, #043a56 86%, #032c43 100%);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}

/* ============================================================
   VANDET
   ============================================================ */
#ocean{position:fixed;inset:0;overflow:hidden;z-index:0;transition:transform 1.7s cubic-bezier(.5,0,.15,1);transform-origin:50% 70%}
body.zoom #ocean{transform:scale(1.10)}

#lightrays{
  position:absolute;inset:-15% -25%;
  background:
    linear-gradient(97deg, rgba(255,255,255,.20) 0 2.5%, transparent 2.5% 11%),
    linear-gradient(85deg, rgba(255,255,255,.15) 0 2%, transparent 2% 13%),
    linear-gradient(101deg, rgba(189,238,247,.13) 0 4%, transparent 4% 20%),
    linear-gradient(78deg, rgba(255,255,255,.09) 0 3%, transparent 3% 17%);
  animation:rays 24s ease-in-out infinite alternate;pointer-events:none;
  mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,.45) 55%, transparent 85%);
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,.45) 55%, transparent 85%);
}
@keyframes rays{from{transform:translateX(-3%) skewX(-2deg)}to{transform:translateX(3%) skewX(2deg)}}

#caustics{
  position:absolute;left:0;right:0;top:0;height:34%;
  background:
    radial-gradient(60% 40% at 20% 0%, rgba(255,255,255,.22), transparent 70%),
    radial-gradient(50% 45% at 62% 0%, rgba(255,255,255,.18), transparent 70%),
    radial-gradient(40% 35% at 88% 0%, rgba(255,255,255,.14), transparent 70%);
  animation:caust 13s ease-in-out infinite alternate;pointer-events:none;
}
@keyframes caust{from{opacity:.55;transform:translateX(-2%)}to{opacity:1;transform:translateX(2%)}}

.bubble{
  position:absolute;bottom:-8vh;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), rgba(255,255,255,.18) 55%, rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.45);pointer-events:none;
}
@keyframes rise{
  0%{transform:translate3d(0,0,0) scale(.7);opacity:0}
  12%{opacity:.8}
  100%{transform:translate3d(var(--drift,14px),-115vh,0) scale(1.15);opacity:0}
}

/* ============================================================
   REVET
   ============================================================ */
#reef{
  position:fixed;left:0;right:0;bottom:0;z-index:1;
  height:min(30vh,270px);pointer-events:none;
  transition:transform 1.7s cubic-bezier(.5,0,.15,1);transform-origin:50% 100%;
}
body.zoom #reef{transform:scale(1.08)}
#reef .sandsvg{position:absolute;left:-2%;right:-2%;bottom:0;width:104%;height:100%}
#reef .item{position:absolute;bottom:0;transform-origin:50% 100%}
#reef .item svg{display:block;width:100%;height:100%}
.sway{animation:sway 7s ease-in-out infinite alternate}
.sway-slow{animation:sway 11s ease-in-out infinite alternate}
.sway-fast{animation:sway 4.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}

/* ============================================================
   SVØMMERE
   ============================================================ */
.swimlayer{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#swimBack{z-index:1}
#swimFront{z-index:3;transition:opacity 1.1s ease}
/* når kortet er åbnet, svømmer de bag kortet så teksten kan læses */
body.opened #swimFront{z-index:1;opacity:.9}
.swim{position:absolute;left:0;top:0;will-change:transform}
.bob{animation:bob 5s ease-in-out infinite alternate}
.bob svg{display:block;width:100%;height:auto}
@keyframes bob{from{transform:translateY(-9px)}to{transform:translateY(9px)}}

/* ============================================================
   SCENEN — kortet sidder i den øverste del, revet er frit
   ============================================================ */
#stage{
  position:fixed;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  padding:max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  padding-bottom:min(26vh,235px);
}
#zoomer{transform:scale(.66);transition:transform 1.6s cubic-bezier(.42,0,.12,1);will-change:transform}
body.zoom #zoomer{transform:scale(1)}

#book{
  position:relative;
  width:min(88vw, 900px);
  height:min(62vh, 470px);
  perspective:2200px;perspective-origin:60% 50%;transform-style:preserve-3d;
}

/* ---------- FORSIDEN (uden tekst) ---------- */
#cover{
  position:absolute;inset:0;z-index:5;
  transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.6s cubic-bezier(.62,.02,.2,1), opacity .45s 1.15s linear;
  cursor:pointer;animation:float 7s ease-in-out infinite;
}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -12px}}
.cover-face{
  position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;
  box-shadow:0 34px 74px -16px var(--shadow), 0 3px 0 rgba(255,255,255,.16) inset;
  background:radial-gradient(118% 82% at 50% 0%, #12719c 0%, #08496b 44%, #05304c 100%);
}
.cover-face::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.11) 1px, transparent 1px);
  background-size:16px 16px;opacity:.55;
}
.cover-back{
  position:absolute;inset:0;border-radius:16px;transform:rotateY(180deg);backface-visibility:hidden;
  background:linear-gradient(150deg,var(--paper) 0%, var(--paper2) 100%);
  box-shadow:0 24px 50px -20px var(--shadow);
}
.cover-frame{
  position:absolute;inset:13px;border-radius:10px;
  border:1.5px solid rgba(232,198,106,.45);
  box-shadow:0 0 0 6px rgba(232,198,106,.10) inset;pointer-events:none;
}
.cover-art{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:16px}
.cover-art .art{position:absolute}
.cover-art .art svg{display:block;width:100%;height:100%}
.tint-cool{color:rgba(189,238,247,.26)}

/* ---------- SEGLET ---------- */
#sealWrap{
  position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:clamp(130px,20vmin,180px);aspect-ratio:1;
  display:grid;place-items:center;z-index:6;touch-action:none;
}
#sealRing{position:absolute;inset:0;transform:rotate(-90deg)}
#sealRing circle{fill:none;stroke-linecap:round}
#ringTrack{stroke:rgba(232,198,106,.24);stroke-width:3}
#ringFill{stroke:var(--gold-light);stroke-width:4.5;filter:drop-shadow(0 0 7px rgba(232,198,106,.6))}
#seal{
  width:74%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #d8543f 0%, var(--wax) 46%, var(--wax-dark) 100%);
  box-shadow:0 10px 26px -6px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.24) inset, 0 -6px 14px rgba(0,0,0,.3) inset;
  display:grid;place-items:center;color:rgba(255,228,218,.92);position:relative;
  transition:transform .18s ease, filter .5s ease, opacity .5s ease;
}
#seal::before{
  content:"";position:absolute;inset:-7%;border-radius:47% 53% 51% 49% / 52% 48% 53% 47%;
  background:radial-gradient(circle at 40% 35%, rgba(203,78,60,.95), rgba(141,36,25,.95));z-index:-1;
}
#seal svg{width:58%;height:58%;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
#sealWrap.holding #seal{transform:scale(.94)}
#sealWrap.nudge{animation:nudge .45s ease}
@keyframes nudge{0%,100%{translate:-50% -50%}25%{translate:calc(-50% - 7px) -50%}75%{translate:calc(-50% + 7px) -50%}}
#sealWrap.melt #seal{transform:scale(1.8);filter:blur(10px);opacity:0}
#sealWrap.melt #sealRing{opacity:0;transition:opacity .4s}

/* forsidehint – i vandet under kortet */
#hint{
  position:fixed;left:50%;translate:-50% 0;bottom:clamp(100px,31vh,260px);
  font-family:'Caveat',cursive;font-size:clamp(18px,2.6vmin,25px);
  color:rgba(255,255,255,.94);letter-spacing:.3px;white-space:nowrap;
  opacity:0;visibility:hidden;transition:opacity .8s ease;pointer-events:none;
  text-shadow:0 2px 12px rgba(2,40,60,.7);z-index:4;
}
#hint.show{opacity:1;visibility:visible;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
body.opened #hint{opacity:0 !important;visibility:hidden !important;animation:none !important}

/* ============================================================
   KORTETS INDERSIDE
   ============================================================ */
#inside{
  position:absolute;inset:0;z-index:2;border-radius:16px;overflow:hidden;
  background:linear-gradient(155deg,var(--card1) 0%, var(--card2) 55%, var(--card3) 100%);
  box-shadow:0 30px 70px -20px var(--shadow), 0 0 0 1px rgba(200,151,63,.38);
  display:grid;grid-template-columns:1.1fr .9fr;
  opacity:0;transform:scale(.985);
  transition:opacity .5s .35s ease, transform .8s .35s cubic-bezier(.2,.9,.3,1);
}
#book.open #inside{opacity:1;transform:scale(1)}
#book.open #cover{transform:rotateY(-168deg);opacity:0;pointer-events:none;animation:none}
#inside::before{
  content:"";position:absolute;left:calc(55% - 1px);top:5%;bottom:5%;width:2px;
  background:linear-gradient(to bottom,transparent,rgba(232,198,106,.45),transparent);
  z-index:3;pointer-events:none;
}
.page{position:relative;padding:clamp(18px,3vmin,34px);display:flex;flex-direction:column;min-height:0}
.page-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.page-deco .art{position:absolute}
.page-deco .art svg{display:block;width:100%;height:100%}
/* pynten inde i det mørke kort — anes frem for at forsvinde */
.tint-sea{color:rgba(63,198,221,.11)}
.tint-sand{color:rgba(232,198,106,.14)}

/* ---------- HILSEN ---------- */
#left{justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.crest{display:flex;align-items:center;gap:10px;color:var(--gold-light);margin-bottom:clamp(4px,1vmin,10px)}
.crest .line{height:1px;flex:1;background:linear-gradient(to right,transparent,rgba(232,198,106,.5),transparent)}
.crest svg{width:clamp(22px,3vmin,32px);height:clamp(22px,3vmin,32px)}
h1{
  font-family:'Playfair Display',Georgia,serif;font-weight:600;
  font-size:clamp(24px,4.6vmin,40px);line-height:1.06;margin:0 0 .34em;
  color:var(--creme);letter-spacing:.3px;
}
h1 .navn{display:block;color:var(--coral-l);font-style:italic}
/* verset: hver linje for sig, med hængende indryk hvis den må ombryde */
.greet p{
  margin:0 0 .2em;font-size:clamp(13.5px,2vmin,17.5px);line-height:1.52;color:var(--card-ink);
  padding-left:1.2em;text-indent:-1.2em;
}
.greet p:last-child{margin-bottom:0}
.sign{margin-top:clamp(10px,2.1vmin,20px);font-family:'Caveat',cursive;font-size:clamp(20px,3.2vmin,29px);line-height:1.15;color:var(--coral-l)}
.sign small{display:block;font-family:'Lora',serif;font-size:clamp(10px,1.35vmin,12px);color:var(--card-soft);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.3em}

/* ---------- KOØJET PÅ HØJRE SIDE ---------- */
#right{align-items:center;justify-content:center}
.porthole{
  position:relative;width:min(88%, 40vmin);aspect-ratio:1;border-radius:50%;
  padding:clamp(8px,1.4vmin,14px);
  background:linear-gradient(155deg,#f2d68c 0%, #c8973f 46%, #9c7020 100%);
  box-shadow:0 16px 32px -14px rgba(2,26,44,.55), 0 2px 0 rgba(255,255,255,.5) inset;
}
.ph-glass{
  position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:linear-gradient(180deg,#a6e7f4 0%, #55b9d1 55%, #2d8dab 100%);
  box-shadow:0 0 0 3px rgba(255,255,255,.35) inset, 0 14px 28px rgba(2,26,44,.35) inset;
}
.ph-sand{position:absolute;left:-8%;right:-8%;bottom:-8%;height:28%;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#f0dcb0,#d9be8a)}
.ph-item{position:absolute}
.ph-item svg{display:block;width:100%;height:100%}
.ph-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(142deg, rgba(255,255,255,.42) 0 16%, rgba(255,255,255,.10) 24%, transparent 38%)}
.ph-bolts{position:absolute;inset:0;pointer-events:none}
.bolt{position:absolute;width:clamp(5px,.9vmin,9px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 30%, #fff2c8, #9c7020);transform:translate(-50%,-50%)}
.ph-bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8)}
@keyframes phrise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-190px);opacity:0}}

/* ============================================================
   SKATTEKISTEN — uden for kortet, nede på havbunden
   ============================================================ */
#chest{
  position:fixed;left:50%;z-index:5;
  bottom:calc(max(8px, env(safe-area-inset-bottom)) + 3vh);
  width:clamp(122px,20vmin,215px);aspect-ratio:120/104;
  border:0;background:none;padding:0;cursor:pointer;
  transform:translateX(-50%);
  opacity:0;pointer-events:none;
}
#chest.live{opacity:1}
#chest.ready{pointer-events:auto}
#chest.flying{animation:chestX 1.55s cubic-bezier(.12,.5,.35,1) forwards}
#chestInner{position:absolute;inset:0;transform-origin:50% 100%;perspective:900px}
#chestInner.falling{animation:chestY 1.55s linear forwards}
#chestInner.idle{animation:chestIdle 3.6s ease-in-out infinite}
@keyframes chestX{
  0%  {transform:translateX(calc(-50% + var(--sx,0px))) scale(.30)}
  100%{transform:translateX(-50%) scale(1)}
}
@keyframes chestY{
  0%  {transform:translateY(var(--sy,-320px));animation-timing-function:ease-out}
  12% {transform:translateY(calc(var(--sy,-320px) - 46px));animation-timing-function:cubic-bezier(.42,0,.9,.5)}
  52% {transform:translateY(0) scale(1)}
  58% {transform:translateY(0) scaleX(1.14) scaleY(.82)}
  70% {transform:translateY(-30%) scale(1)}
  80% {transform:translateY(0) scaleX(1.07) scaleY(.90)}
  89% {transform:translateY(-11%) scale(1)}
  95% {transform:translateY(0) scaleX(1.03) scaleY(.96)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes chestIdle{
  0%,74%,100%{transform:translateY(0) rotate(0)}
  80%{transform:translateY(-7px) rotate(-2.5deg)}
  86%{transform:translateY(-2px) rotate(2.5deg)}
  92%{transform:translateY(0) rotate(-1deg)}
}
.chest-body{position:absolute;left:0;right:0;bottom:0;height:67.3%;z-index:2;filter:drop-shadow(0 10px 14px rgba(2,26,44,.45))}
.chest-lid{position:absolute;left:0;right:0;top:0;height:44.2%;z-index:3;transform-origin:50% 100%;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.32,-.3,.35,1.35)}
.lid-face{position:absolute;inset:0;transition:opacity .24s .30s}
.lid-in{opacity:0}
#chest.opened .lid-out{opacity:0}
#chest.opened .lid-in{opacity:1}
.lid-face svg{display:block;width:100%;height:100%}
.chest-mouth{position:absolute;left:0;right:0;bottom:0;height:67.3%;z-index:3;opacity:0;transition:opacity .45s .3s}
.chest-mouth svg{display:block;width:100%;height:100%}
#chest.opened .chest-mouth{opacity:1}
#chest.lidback .chest-lid{z-index:1}
.chest-body svg,.chest-lid svg{display:block;width:100%;height:100%}
#chest.opened .chest-lid{transform:translateY(-16.5%) rotateX(12deg) scaleX(1.04)}
.chest-glow{
  position:absolute;left:20%;right:20%;top:31%;height:16%;border-radius:50%;z-index:4;filter:blur(3px);
  background:radial-gradient(ellipse at center, rgba(255,222,140,.85), rgba(255,214,110,.30) 48%, rgba(255,205,90,0) 78%);
  opacity:0;transition:opacity .5s .35s;
}
#chest.opened .chest-glow{opacity:1;animation:glowpulse 2.6s ease-in-out infinite}
@keyframes glowpulse{0%,100%{opacity:.7}50%{opacity:1}}
.sandpuff{
  position:absolute;left:50%;bottom:-14%;translate:-50% 0;width:190%;height:44%;
  border-radius:50%;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(ellipse at center, rgba(239,220,178,.95), rgba(224,200,150,.35) 55%, rgba(224,200,150,0) 75%);
}
.sandpuff.go{animation:puff 1s ease-out forwards}
@keyframes puff{0%{opacity:0;transform:translateX(-50%) scale(.25)}18%{opacity:.95}100%{opacity:0;transform:translateX(-50%) scale(1.6)}}
/* ============================================================
   FEST — 12 sekunders fanfare i fire akter
   ============================================================ */
#fx{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
#warm{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:linear-gradient(180deg, rgba(255,228,155,.42) 0%, rgba(255,196,95,.15) 45%, rgba(255,170,60,0) 78%);
}
#flash{
  position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--fx,50%) var(--fy,78%),
    rgba(255,246,212,.95) 0%, rgba(255,214,110,.45) 28%, rgba(255,200,80,0) 64%);
}
@keyframes fx-flash{0%{opacity:0}7%{opacity:1}100%{opacity:0}}
@keyframes fx-warm{0%{opacity:0}14%{opacity:1}60%{opacity:.7}100%{opacity:0}}

/* lysstråle op gennem vandet */
.fx-ray{
  position:fixed;pointer-events:none;z-index:6;transform-origin:50% 100%;filter:blur(7px);opacity:0;
  background:linear-gradient(to top, rgba(255,231,163,.60) 0%, rgba(255,231,163,.20) 42%, rgba(255,231,163,0) 82%);
  clip-path:polygon(44% 100%, 56% 100%, 100% 0%, 0% 0%);
}
@keyframes fx-ray{
  0%  {opacity:0;   transform:translateX(-50%) scaleY(.06) scaleX(.5)}
  12% {opacity:.95; transform:translateX(-50%) scaleY(1)   scaleX(.8)}
  32% {opacity:.80; transform:translateX(-50%) scaleY(1)   scaleX(1.06)}
  62% {opacity:.55; transform:translateX(-50%) scaleY(1)   scaleX(.92)}
  100%{opacity:0;   transform:translateX(-50%) scaleY(1.04) scaleX(1.3)}
}

/* chokbølger */
.fx-ring{
  position:fixed;border-radius:50%;pointer-events:none;z-index:6;opacity:0;
  border:3px solid rgba(255,236,178,.9);
  box-shadow:0 0 20px rgba(255,225,150,.5), 0 0 20px rgba(255,225,150,.3) inset;
}
@keyframes fx-ring{
  0%{opacity:.9;transform:translate(-50%,-50%) scale(.05)}
  65%{opacity:.32}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}

/* mønter i bue */
.fx-coin{position:fixed;z-index:8;pointer-events:none;will-change:transform}
.fx-coin .cy{width:100%;height:100%;will-change:transform}
.fx-coin .cf{
  width:100%;height:100%;border-radius:50%;
  background:linear-gradient(150deg,#fff3c4 0%,#ffd76f 38%,#d8a63c 70%,#a9761f 100%);
  box-shadow:0 1px 4px rgba(0,0,0,.4), 0 0 0 1px rgba(255,244,200,.55) inset;
}
@keyframes fx-cx{from{transform:translateX(0)}to{transform:translateX(var(--cx))}}
@keyframes fx-cy{
  0%  {transform:translateY(0);animation-timing-function:cubic-bezier(.12,.62,.32,1)}
  40% {transform:translateY(var(--cup));animation-timing-function:cubic-bezier(.55,.05,.85,.5)}
  100%{transform:translateY(var(--cdn))}
}
@keyframes fx-spin{
  0%{transform:rotate(0) scaleX(1)}25%{transform:rotate(90deg) scaleX(.14)}
  50%{transform:rotate(180deg) scaleX(1)}75%{transform:rotate(270deg) scaleX(.14)}
  100%{transform:rotate(360deg) scaleX(1)}
}
@keyframes fx-fade{0%,68%{opacity:1}100%{opacity:0}}

/* konfetti der daler som i vand */
.fx-conf{position:fixed;z-index:8;pointer-events:none;will-change:transform}
.fx-conf .cfy{width:100%;height:100%;will-change:transform}
.fx-conf .cfi{display:block;width:100%;height:100%;border-radius:2px}
@keyframes fx-cfx{from{transform:translateX(0)}to{transform:translateX(var(--x))}}
@keyframes fx-cfy{
  0%  {transform:translateY(0);animation-timing-function:cubic-bezier(.08,.72,.3,1)}
  30% {transform:translateY(var(--yup));animation-timing-function:linear}
  100%{transform:translateY(var(--ydn))}
}
@keyframes fx-flut{
  0%{transform:rotate(var(--r0)) scaleX(1)}
  50%{transform:rotate(var(--r1)) scaleX(-.35)}
  100%{transform:rotate(var(--r0)) scaleX(1)}
}

/* glimt */
.fx-spark{
  position:fixed;z-index:8;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fffdf2 0%, #ffe9a8 42%, rgba(255,220,130,0) 72%);
  clip-path:polygon(50% 0%,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0% 50%,40% 40%);
}
@keyframes fx-twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(70deg)}}

/* dyrene jubler */
.bob.cheer{animation:fx-cheer 1.15s cubic-bezier(.25,.9,.3,1) !important}
@keyframes fx-cheer{
  0%  {transform:translateY(0) rotate(0) scale(1)}
  22% {transform:translateY(-30px) rotate(-9deg) scale(1.16)}
  48% {transform:translateY(6px) rotate(7deg) scale(.95)}
  70% {transform:translateY(-14px) rotate(-5deg) scale(1.07)}
  88% {transform:translateY(3px) rotate(3deg) scale(.99)}
  100%{transform:translateY(0) rotate(0) scale(1)}
}

/* kisten fejrer med */
#chest.party{animation:fx-chestparty 12s ease-out}
@keyframes fx-chestparty{
  0%  {transform:translateX(-50%) scale(1)}
  2%  {transform:translateX(-50%) scale(1.18)}
  5%  {transform:translateX(-50%) scale(.97)}
  8%  {transform:translateX(-50%) scale(1.06)}
  12% {transform:translateX(-50%) scale(1)}
  28% {transform:translateX(-50%) scale(1.04)}
  34% {transform:translateX(-50%) scale(1)}
  50% {transform:translateX(-50%) scale(1.16)}
  56% {transform:translateX(-50%) scale(.99)}
  61% {transform:translateX(-50%) scale(1.07)}
  68% {transform:translateX(-50%) scale(1)}
  82% {transform:translateX(-50%) scale(1.03)}
  100%{transform:translateX(-50%) scale(1)}
}
#chest.party .chest-glow{animation:fx-glowburst 12s ease-out !important}
@keyframes fx-glowburst{
  0%{opacity:1;transform:scale(1)}
  4%{opacity:1;transform:scale(2.6)}
  14%{opacity:.85;transform:scale(1.4)}
  30%{opacity:1;transform:scale(1.8)}
  44%{opacity:.85;transform:scale(1.4)}
  52%{opacity:1;transform:scale(2.8)}
  66%{opacity:.9;transform:scale(1.6)}
  84%{opacity:1;transform:scale(2.0)}
  100%{opacity:1;transform:scale(1.5)}
}

/* ============================================================
   OVERLAYS
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  background:rgba(3,44,67,.6);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;visibility:hidden;transition:opacity .35s ease, visibility .35s;
}
.overlay.show{opacity:1;visibility:visible}
.sheet{
  width:min(600px,100%);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(155deg,var(--card1) 0%, var(--card2) 100%);
  border-radius:16px;padding:clamp(18px,3.4vmin,34px);
  box-shadow:0 30px 60px -18px rgba(2,26,44,.65), 0 0 0 1px rgba(200,151,63,.35);
  transform:translateY(14px) scale(.97);transition:transform .45s cubic-bezier(.2,.9,.3,1);text-align:center;
}
.overlay.show .sheet{transform:none}
.sheet.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.q-num{
  font-size:clamp(10px,1.5vmin,12px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--card-soft);margin-bottom:clamp(8px,1.6vmin,16px);
}
.q-text{font-family:'Playfair Display',Georgia,serif;font-size:clamp(17px,2.7vmin,25px);line-height:1.3;color:var(--creme);margin:0 0 clamp(12px,2.2vmin,22px)}
.opts{display:grid;gap:9px}
.opt{
  font-family:'Lora',serif;font-size:clamp(14px,1.95vmin,17px);text-align:left;
  padding:clamp(12px,1.9vmin,17px) 16px;border-radius:11px;
  border:1.5px solid rgba(63,198,221,.26);background:rgba(255,255,255,.06);color:var(--card-ink);
  cursor:pointer;transition:transform .12s, background .2s, border-color .2s, opacity .2s;line-height:1.35;
}
.opt:active{transform:scale(.985)}
.opt:disabled{cursor:default;opacity:.42}
.opt.wrong{border-color:rgba(226,112,90,.85);background:rgba(226,112,90,.18);color:#ffb3a0}
.opt.right,.opt.right:disabled{border-color:var(--gold-light);background:rgba(232,198,106,.18);color:#ffe9b8;opacity:1}

/* frem og tilbage mellem spørgsmålene */
.q-nav{margin-top:clamp(12px,2vmin,20px);display:flex;justify-content:space-between;align-items:center;gap:12px}
.navbtn{
  font-family:'Lora',serif;font-size:clamp(12.5px,1.7vmin,14.5px);
  padding:9px 18px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--gold-soft);background:rgba(232,198,106,.08);color:var(--card-ink);
  transition:background .2s, transform .12s, opacity .2s;
}
.navbtn:active{transform:scale(.97)}
.navbtn:disabled{opacity:.25;cursor:default}

/* pop-up med fun-fact efter et rigtigt svar */
#faktaOverlay{z-index:70}
.fakta-ic{
  width:clamp(42px,6vmin,58px);height:clamp(42px,6vmin,58px);margin:0 auto clamp(8px,1.4vmin,14px);
  border-radius:50%;display:grid;place-items:center;color:#2a1c02;
  background:linear-gradient(150deg,#ffe89a 0%, var(--gold) 100%);
  box-shadow:0 6px 16px -5px rgba(2,26,44,.6);
}
.fakta-ic svg{width:56%;height:56%}
.fakta-h{
  font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(19px,3vmin,28px);
  color:var(--gold-light);margin:0 0 clamp(8px,1.4vmin,14px);letter-spacing:.02em;
}
.fakta-p{
  font-size:clamp(13px,1.85vmin,16px);line-height:1.55;color:var(--card-ink);
  margin:0;text-align:left;
}
.btn-guld{border-color:var(--gold-soft);background:rgba(232,198,106,.14);color:var(--creme)}

#voucherOverlay .sheet{width:min(620px,100%);padding:0;overflow:hidden;background:none;box-shadow:none}
.voucher{
  position:relative;background:linear-gradient(155deg,var(--card1) 0%, var(--card2) 60%, var(--card3) 100%);
  border-radius:16px;padding:clamp(20px,3.6vmin,38px) clamp(18px,3.4vmin,36px);
  box-shadow:0 30px 60px -18px rgba(2,26,44,.7);
  transform:scale(.8) rotate(-3deg);opacity:0;
  transition:transform .8s cubic-bezier(.18,1.1,.35,1), opacity .5s;
}
#voucherOverlay.show .voucher{transform:none;opacity:1}
/* efter fanfaren stiger kortet langsomt op nedefra (10 → 12 sek.) */
#voucherOverlay.slow{transition:opacity 1.9s ease, visibility 1.9s}
#voucherOverlay.slow .voucher{
  transform:translateY(80px) scale(.84) rotate(-2deg);
  transition:transform 2.1s cubic-bezier(.16,.86,.24,1), opacity 1.9s ease;
}
#voucherOverlay.slow.show .voucher{transform:none;opacity:1}
.voucher::before{content:"";position:absolute;inset:9px;border-radius:9px;border:1.5px solid rgba(232,198,106,.55);box-shadow:0 0 0 4px rgba(232,198,106,.10) inset;pointer-events:none}
.v-crest{color:var(--gold-light);display:flex;justify-content:center;margin-bottom:6px}
.v-crest svg{width:clamp(34px,5vmin,50px);height:clamp(34px,5vmin,50px)}
.v-title{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(19px,3.1vmin,29px);letter-spacing:.22em;text-transform:uppercase;color:var(--creme);margin:0 0 4px}
.v-sub{font-size:clamp(11px,1.55vmin,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--card-soft);margin-bottom:clamp(14px,2.4vmin,24px)}
.v-items{display:grid;gap:clamp(9px,1.6vmin,14px);text-align:left}
.v-item{display:flex;gap:clamp(11px,1.9vmin,17px);align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(232,198,106,.30);border-radius:12px;padding:clamp(12px,2vmin,18px)}
.v-ic{flex:0 0 auto;width:clamp(38px,5.6vmin,54px);height:clamp(38px,5.6vmin,54px);border-radius:50%;display:grid;place-items:center;color:var(--card3);background:linear-gradient(150deg,#ffe89a 0%, var(--gold) 100%);box-shadow:0 5px 12px -4px rgba(2,26,44,.55)}
.v-ic svg{width:56%;height:56%}
.v-h{font-family:'Playfair Display',serif;font-size:clamp(15.5px,2.3vmin,21px);color:#ffe9b8;line-height:1.2}
.v-p{font-size:clamp(12px,1.7vmin,14.5px);color:var(--card-soft);margin-top:3px;line-height:1.35}
.v-foot{margin-top:clamp(14px,2.4vmin,24px);padding-top:clamp(11px,1.9vmin,18px);border-top:1px dashed rgba(232,198,106,.45);display:flex;justify-content:space-between;gap:14px;align-items:flex-end}
.v-to{text-align:left;font-size:clamp(10px,1.4vmin,12px);letter-spacing:.16em;text-transform:uppercase;color:var(--card-soft);min-width:0}
.v-to b{display:block;font-family:'Caveat',cursive;font-size:clamp(19px,2.7vmin,26px);letter-spacing:0;text-transform:none;color:var(--coral-l);font-weight:700;line-height:1.15}
.closebar{margin-top:clamp(12px,2vmin,20px);display:flex;justify-content:center}
.btn{font-family:'Lora',serif;font-size:clamp(13px,1.8vmin,15px);padding:11px 26px;border-radius:999px;cursor:pointer;border:1.5px solid rgba(253,247,234,.6);background:rgba(253,247,234,.14);color:var(--paper);transition:background .2s, transform .12s}
.btn:active{transform:scale(.97)}

#sound{
  position:fixed;z-index:70;top:max(12px, env(safe-area-inset-top));right:max(12px, env(safe-area-inset-right));
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  border:1px solid rgba(255,255,255,.45);background:rgba(3,44,67,.32);color:rgba(255,255,255,.92);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#sound svg{width:20px;height:20px}
#sound:active{transform:scale(.94)}

/* ============================================================
   PORTRÆT / TELEFON
   ============================================================ */
@media (orientation:portrait){
  #stage{padding-bottom:min(23vh,210px)}
  #book{width:min(94vw,600px);height:min(50vh,460px)}
  #zoomer{transform:scale(.68)}
  #cover{transform-origin:center top}
  #book.open #cover{transform:rotateX(166deg)}
  #inside{grid-template-columns:1fr}
  #inside::before{display:none}
  #right{display:none}
  h1{font-size:clamp(26px,6.4vw,38px)}
  .greet p{font-size:clamp(14.5px,3.4vw,17px)}
  .sign{font-size:clamp(21px,5.4vw,29px)}
  #reef{height:min(24vh,215px)}
  #chest{width:clamp(120px,32vw,200px)}
  .v-foot{flex-direction:column;align-items:flex-start;gap:8px}
  .v-foot .v-to:last-child{text-align:left !important}
}
@media (orientation:portrait) and (max-height:740px){
  #stage{padding-bottom:min(21vh,170px)}
  #book{height:min(46vh,390px)}
  .page{padding:clamp(16px,4vw,24px)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important}
  #cover{transition:opacity .4s}
  #book.open #cover{transform:none}
}

const CIRC = 2 * Math.PI * 46;
ringFill.style.strokeDasharray = CIRC;
ringFill.style.strokeDashoffset = CIRC;

let holdTimer = null, aabnet = false;

function startHold(e){
  if (aabnet) return;
  e.preventDefault();
  Lyd.wake(); Lyd.hold();
  sealWrap.classList.add("holding");
  ringFill.style.transition = `stroke-dashoffset ${CONFIG.holdTid}ms linear`;
  ringFill.style.strokeDashoffset = 0;

}
function stopHold(){
  if (aabnet || holdTimer === null) return;
  clearTimeout(holdTimer); holdTimer = null;
  sealWrap.classList.remove("holding");
  ringFill.style.transition = "stroke-dashoffset .28s ease";
  ringFill.style.strokeDashoffset = CIRC;
  sealWrap.classList.remove("nudge"); void sealWrap.offsetWidth; sealWrap.classList.add("nudge");
  hintEl.classList.add("show");
}
function aabnKort(){
  aabnet = true; holdTimer = null;
  hintEl.classList.remove("show");
  document.body.classList.add("opened");

  Lyd.segl();
  sealWrap.classList.add("melt");
  for (let i = 0; i < 16; i++) setTimeout(spawnBubble, i * 50);

  setTimeout(() => { document.body.classList.add("zoom"); Lyd.zoom(); }, 220);   /* zoom ind */
  setTimeout(() => { book.classList.add("open"); Lyd.aabn(); }, 950);            /* kortet folder sig op */
  setTimeout(hopChestOut, 1950);                                                 /* kisten hopper ud */
}

function hopChestOut(){
  chest.classList.add("live");
  if (reduced){ chest.classList.add("ready"); return; }

  /* find startpunktet inde i kortet, og hvor langt kisten skal falde */
  const c = book.getBoundingClientRect();
  const k = chest.getBoundingClientRect();
  const sx = (c.left + c.width * 0.68) - (k.left + k.width / 2);
  const sy = (c.top  + c.height * 0.55) - (k.top  + k.height / 2);
  chest.style.setProperty("--sx", Math.round(sx) + "px");
  chest.style.setProperty("--sy", Math.round(sy) + "px");

  Lyd.svirp();
  chest.classList.add("flying");
  chestInner.classList.add("falling");

  setTimeout(() => { Lyd.dunk(.18); sandpuff.classList.add("go"); }, 800);   /* landing */
  setTimeout(() => Lyd.dunk(.10), 1240);                                     /* hop */
  setTimeout(() => Lyd.dunk(.06), 1440);

  chestInner.addEventListener("animationend", function done(ev){
    if (ev.animationName !== "chestY") return;
    chestInner.removeEventListener("animationend", done);
    chest.classList.remove("flying");
    chestInner.classList.remove("falling");
    chestInner.classList.add("idle");
    chest.classList.add("ready");
  });
}

const ANTAL = CONFIG.quiz.length;
const besvaret = new Array(ANTAL).fill(false);   /* husker hvad man har klaret */
let qi = 0, laastOp = false;

const erSidste = () => qi === ANTAL - 1;

function visSpoergsmaal(){
  const q = CONFIG.quiz[qi];
  qNum.textContent = "Spørgsmål " + (qi + 1);
  qText.textContent = q.q;
  qOpts.innerHTML = "";
  q.svar.forEach(s => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.textContent = s.t;
    if (besvaret[qi]){
      /* allerede klaret — svaret står markeret og kan ikke ændres */
      b.disabled = true;
      if (s.ok) b.classList.add("right");
    } else {
      b.addEventListener("click", () => svarKlik(b, s));
    }
    qOpts.appendChild(b);
  });
  qPrev.disabled = qi === 0;
  qNext.disabled = erSidste();
}
function gaaTil(i){
  qi = Math.max(0, Math.min(ANTAL - 1, i));
  visSpoergsmaal();
}
function svarKlik(btn, s){
  Lyd.wake();
  if (s.ok){
    Lyd.rigtig();
    btn.classList.add("right");
    besvaret[qi] = true;
    [...qOpts.children].forEach(b => b.disabled = true);
    setTimeout(visFakta, 520);
  } else {
    Lyd.forkert();
    btn.classList.add("wrong");
    setTimeout(() => btn.classList.remove("wrong"), 900);
    quizSheet.classList.remove("shake"); void quizSheet.offsetWidth; quizSheet.classList.add("shake");
  }
}
function visFakta(){
  faktaH.textContent = CONFIG.rigtigOverskrift;
  faktaText.textContent = CONFIG.quiz[qi].fakta;
  faktaNext.textContent = erSidste() ? CONFIG.sidsteKnap : CONFIG.naesteKnap;
  faktaOverlay.classList.add("show");
}

/* knappen i pop-up'en: videre til næste spørgsmål — eller åbn kisten */

/* =============================================================
   FESTEN — 12 sekunder i fire akter.
   Partiklerne bliver først lavet, når de skal bruges, så der
   ikke kommer et hak i starten på langsomme enheder.
   ============================================================= */
const FX = (() => {
  const host   = Object.assign(document.createElement("div"), { id:"fx" });
  const warmL  = Object.assign(document.createElement("div"), { id:"warm" });
  const flashL = Object.assign(document.createElement("div"), { id:"flash" });
  document.body.append(warmL, host, flashL);

  const rnd = (a,b) => a + Math.random()*(b-a);
  const nu  = (t, fn) => setTimeout(fn, t);
  const FARVER = ["#ffe89a","#e8c66a","#c8973f","#3fc6dd","#bdeef7","#e2705a","#fdf7ea","#f5952b","#9a6ad8","#5fce93"];

  function node(cls, css){
    const d = document.createElement("div");
    d.className = cls; d.style.cssText = css;
    host.appendChild(d);
    return d;
  }
  const kill = (el, ms) => setTimeout(() => el.remove(), ms);

  /* spreder mange partikler ud over et tidsvindue i små puljer */
  function drys(antal, vindue, fn){
    const puljer = Math.max(1, Math.ceil(antal / 8));
    const pr = Math.ceil(antal / puljer);
    for (let p = 0; p < puljer; p++)
      nu(p * (vindue / puljer), () => { for (let i = 0; i < pr; i++) fn(); });
  }

  /* ---------- lys ---------- */
  function glimt(cx, cy, dur){
    flashL.style.setProperty("--fx", (cx / innerWidth  * 100) + "%");
    flashL.style.setProperty("--fy", (cy / innerHeight * 100) + "%");
    flashL.style.animation = "none"; void flashL.offsetWidth;
    flashL.style.animation = `fx-flash ${dur}ms ease-out`;
  }
  function varmtHav(dur){
    warmL.style.animation = "none"; void warmL.offsetWidth;
    warmL.style.animation = `fx-warm ${dur}ms ease-in-out`;
  }
  function straale(cx, cy, dur){
    const h = cy + 40, w = Math.min(innerWidth * 1.15, 940);
    const d = node("fx-ray", `left:${cx}px;top:${cy-h}px;width:${w}px;height:${h}px`);
    d.style.animation = `fx-ray ${dur}ms cubic-bezier(.2,.7,.3,1) forwards`;
    kill(d, dur + 200);
  }
  function ring(cx, cy, size, dur){
    const d = node("fx-ring", `left:${cx}px;top:${cy}px;width:${size}px;height:${size}px`);
    d.style.animation = `fx-ring ${dur}ms cubic-bezier(.1,.6,.3,1) forwards`;
    kill(d, dur + 150);
  }

  /* ---------- mønter ---------- */
  function coin(x, y, s, dur, dx, op, ned){
    const o = node("fx-coin", `left:${x}px;top:${y}px;width:${s}px;height:${s}px;margin-left:${-s/2}px;margin-top:${-s/2}px`);
    const yEl = document.createElement("div"); yEl.className = "cy";
    const f   = document.createElement("div"); f.className = "cf";
    yEl.appendChild(f); o.appendChild(yEl);
    o.style.setProperty("--cx", dx + "px");
    yEl.style.setProperty("--cup", op + "px");
    yEl.style.setProperty("--cdn", ned + "px");
    o.style.animation   = `fx-cx ${dur}ms linear forwards, fx-fade ${dur}ms linear forwards`;
    yEl.style.animation = `fx-cy ${dur}ms forwards`;
    f.style.animation   = `fx-spin ${rnd(480,900)}ms linear infinite`;
    kill(o, dur + 250);
  }
  function fontaene(cx, cy, antal, spredning){
    for (let i = 0; i < antal; i++)
      coin(cx, cy, rnd(9,20), rnd(1700,2700),
           rnd(-spredning, spredning), -rnd(200, innerHeight*.82), rnd(40,220));
  }
  function guldregn(antal, vindue){
    drys(antal, vindue, () =>
      coin(rnd(0, innerWidth), -30, rnd(8,18), rnd(2600,4200),
           rnd(-90,90), rnd(20,90), innerHeight + 140));
  }

  /* ---------- konfetti ---------- */
  function stykke(x, y, dur, dx, op, ned){
    const w = rnd(7,12), h = rnd(11,19);
    const o = node("fx-conf", `left:${x}px;top:${y}px;width:${w}px;height:${h}px`);
    const yEl = document.createElement("div"); yEl.className = "cfy";
    const b   = document.createElement("div"); b.className = "cfi";
    b.style.background = FARVER[Math.floor(Math.random()*FARVER.length)];
    if (Math.random() < .2) b.style.borderRadius = "50%";
    yEl.appendChild(b); o.appendChild(yEl);
    o.style.setProperty("--x", dx + "px");
    yEl.style.setProperty("--yup", op + "px");
    yEl.style.setProperty("--ydn", ned + "px");
    b.style.setProperty("--r0", rnd(-40,40) + "deg");
    b.style.setProperty("--r1", rnd(140,260) + "deg");
    o.style.animation   = `fx-cfx ${dur}ms cubic-bezier(.1,.7,.3,1) forwards, fx-fade ${dur}ms linear forwards`;
    yEl.style.animation = `fx-cfy ${dur}ms forwards`;
    b.style.animation   = `fx-flut ${rnd(700,1500)}ms linear infinite`;
    kill(o, dur + 250);
  }
  function boelge(cx, cy, antal, kraft, retning){
    for (let i = 0; i < antal; i++){
      const dx = retning ? retning * rnd(kraft*.25, kraft*1.6) : rnd(-kraft, kraft);
      stykke(cx, cy, rnd(2600,4200), dx,
             -rnd(kraft*.35, kraft*1.05), rnd(innerHeight*.35, innerHeight*.95));
    }
  }
  function storm(antal, vindue){
    drys(antal, vindue, () =>
      stykke(rnd(0, innerWidth), -30, rnd(3800,6000),
             rnd(-140,140), rnd(10,70), innerHeight + 160));
  }

  /* ---------- glimt og bobler ---------- */
  function glimtRegn(antal, vindue){
    drys(antal, vindue, () => {
      const s = rnd(10,26), dur = rnd(700,1200);
      const d = node("fx-spark", `left:${rnd(2,98)}vw;top:${rnd(2,92)}vh;width:${s}px;height:${s}px`);
      d.style.animation = `fx-twinkle ${dur}ms ease-in-out forwards`;
      kill(d, dur + 120);
    });
  }
  function bobleskyl(antal, skridt){
    for (let i = 0; i < antal; i++) nu(i*skridt, spawnBubble);
  }

  /* ---------- dyrene jubler ---------- */
  function dyreneJubler(fra){
    document.querySelectorAll(".swim .bob").forEach(b => {
      const r = b.getBoundingClientRect();
      const t = fra === "venstre" ? r.left / innerWidth
              : fra === "højre"   ? 1 - r.left / innerWidth
              : Math.random();
      nu(Math.max(0, Math.min(1, t)) * 1100, () => {
        b.classList.add("cheer");
        nu(1200, () => b.classList.remove("cheer"));
      });
    });
  }

  function fest(){
    const r    = chest.getBoundingClientRect();
    const cx   = r.left + r.width/2, cy = r.top + r.height*.30;
    const stor = Math.max(innerWidth, innerHeight) * 1.8;
    const bund = innerHeight * .98;

    chest.classList.add("party");
    nu(12100, () => chest.classList.remove("party"));

    if (reduced){ glimt(cx, cy, 900); return; }

    /* ---- AKT 1 (0-3 s): eksplosionen ---- */
    glimt(cx, cy, 900);
    varmtHav(4200);
    straale(cx, cy, 4600);
    ring(cx, cy, stor, 1500);
    nu(300,  () => ring(cx, cy, stor*.80, 1500));
    nu(600,  () => ring(cx, cy, stor*.60, 1500));
    fontaene(cx, cy, 30, 230);
    nu(420,  () => fontaene(cx, cy, 24, 360));
    nu(980,  () => fontaene(cx, cy, 20, 470));
    nu(260,  () => boelge(cx, cy, 44, 340));
    nu(900,  () => boelge(cx, cy, 34, 420));
    nu(1200, () => { boelge(innerWidth*.06, bund, 26, 430); boelge(innerWidth*.94, bund, 26, 430); });
    bobleskyl(55, 45);
    glimtRegn(44, 3000);
    nu(900,  () => dyreneJubler());

    /* ---- AKT 2 (3-6 s): festen breder sig ud til siderne ---- */
    nu(3400, () => { glimt(cx, cy, 700); ring(cx, cy, stor*.90, 1600); });
    nu(3500, () => fontaene(cx, cy, 24, 520));
    nu(4300, () => fontaene(cx, cy, 18, 620));
    nu(4000, () => boelge(24, innerHeight*.62, 30, 520,  1));            /* kanon fra venstre */
    nu(4200, () => boelge(innerWidth-24, innerHeight*.62, 30, 520, -1)); /* kanon fra højre   */
    nu(4600, () => boelge(cx, cy, 30, 520));
    nu(3600, () => { bobleskyl(40, 55); glimtRegn(52, 2400); });
    nu(5000, () => dyreneJubler("venstre"));

    /* ---- AKT 3 (6-9 s): klimaks med guldregn over hele skærmen ---- */
    nu(6000, () => {
      glimt(cx, cy, 1100);
      varmtHav(3600);
      straale(cx, cy, 3800);
      ring(cx, cy, stor, 1800);
      fontaene(cx, cy, 34, 300);
      guldregn(40, 2400);
      glimtRegn(80, 2800);
      bobleskyl(60, 42);
    });
    nu(6300, () => ring(cx, cy, stor*.85, 1800));
    nu(6400, () => storm(60, 1800));
    nu(6600, () => { ring(cx, cy, stor*.70, 1800); boelge(cx, cy, 38, 560); });
    nu(6900, () => ring(cx, cy, stor*.55, 1800));
    nu(7000, () => fontaene(cx, cy, 26, 480));
    nu(7400, () => dyreneJubler("højre"));

    /* ---- AKT 4 (9-12 s): det lægger sig, gavekortet stiger op ---- */
    nu(9200, () => { storm(34, 1600); glimtRegn(44, 2400); });
    nu(9400, () => { guldregn(12, 1600); bobleskyl(36, 70); });
  }

  return { fest };
})();

/* =============================================================
   GAVEKORT
   ============================================================= */
const voucherOverlay = document.getElementById("voucherOverlay");
/* langsom = kortet stiger op nedefra over 2 sek. efter fanfaren */
function visGavekort(langsom){
  voucherOverlay.classList.toggle("slow", !!langsom);
  void voucherOverlay.offsetWidth;
  voucherOverlay.classList.add("show");
}
document.getElementById("vClose").addEventListener("click", () => { Lyd.klik(); voucherOverlay.classList.remove("show"); });
voucherOverlay.addEventListener("click", e => { if (e.target === voucherOverlay) voucherOverlay.classList.remove("show"); });
quizOverlay.addEventListener("click", e => { if (e.target === quizOverlay) quizOverlay.classList.remove("show"); });

/* =============================================================
   LYDKNAP + BOBLER VED BERØRING
   ============================================================= */
const soundBtn = document.getElementById("sound");
soundBtn.addEventListener("click", () => {
  const on = Lyd.toggle();
  soundBtn.querySelectorAll(".wave").forEach(w => w.style.opacity = on ? 1 : .15);
  if (on) Lyd.klik();
});

document.addEventListener("pointerdown", e => {
  if (reduced) return;
  const b = document.createElement("div");
  b.className = "bubble";
  const s = 6 + Math.random() * 10;
  b.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX}px;top:${e.clientY}px;bottom:auto;position:fixed;z-index:50;pointer-events:none`;
  b.style.setProperty("--drift", (Math.random() * 50 - 25) + "px");
  b.style.animation = "rise 3.2s ease-out forwards";
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 3400);
}, { passive: true });

let sidsteTap = 0;
document.addEventListener("touchend", e => {
  const nu = Date.now();
  if (nu - sidsteTap < 320) e.preventDefault();
  sidsteTap = nu;
}, { passive: false });

/* hvis iPad'en drejes efter kisten er landet, skal den blive liggende rigtigt */
window.addEventListener("resize", () => {
  if (chest.classList.contains("ready")){
    chest.classList.remove("flying");
    chestInner.classList.remove("falling");
  }
});
